# Daily jobs exercise current sources. Historical replay is an explicit milestone job.
.portable-current:
  rules:
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - '**/*.cs'
        - '**/*.csproj'
        - '**/*.cpp'
        - '**/*.h'
        - '**/*.props'
        - '**/*.targets'
        - '**/*.slnx'
        - X/**/*.py
        - X/**/*.json
        - X/**/*.Config
        - X/**/*.inp
        - X/**/*.txt
        - X/**/*.yml
        - .project/scripts/*.py
        - global.json
        - NuGet.Config
        - ThirdParty/Sources/**/*
        - .project/reports/windows-reference/**/*
        - .gitlab-ci.yml
    - when: never

.portable-packages:
  cache:
    key:
      files:
        - X/Analysis/dependency-artifacts.json
    paths:
      - X/Analysis/artifacts/packages/

portable-compatibility-linux-x64:
  extends: .portable-packages
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags: [saas-linux-small-amd64]
  timeout: 30m
  variables:
    GIT_DEPTH: "0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      when: manual
      # Optional on ordinary pushes. Candidate acceptance must explicitly require a successful run.
      allow_failure: true
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 git tini
  script:
    - git fetch --no-tags origin 912fb3d08014f246d48bef14d62a2cba0fdf5bb0 f6273e39983e06042ae8b06e9a3dd0f729ea4b91
    - dotnet restore X/Execution/PrePoMaxX.Execution.slnx --configfile X/Analysis/NuGet.Config --packages X/Analysis/artifacts/packages
    - tini -s -- python3 X/Checks/check.py --profile compatibility --output X/Checks/artifacts/compatibility-linux-x64
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Checks/artifacts/compatibility-linux-x64/
