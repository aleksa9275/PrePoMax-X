# Jobs exercise current sources (whole-library build, D062). Hosted CI is on hold (D058).
.portable-current:
  rules:
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - '**/*.cs'
        - '**/*.csproj'
        - '**/*.cpp'
        - '**/*.h'
        - '**/*.props'
        - '**/*.targets'
        - '**/*.slnx'
        - X/**/*.py
        - X/**/*.json
        - X/**/*.Config
        - X/**/*.inp
        - X/**/*.txt
        - X/**/*.yml
        - X/Feasibility/Cad/fixtures/**/*
        - .project/scripts/*.py
        - global.json
        - NuGet.Config
        - ThirdParty/Sources/**/*
        - ThirdParty/Build/**/*.py
        - .project/reports/windows-reference/**/*
        - .project/reports/multipart-cad-reference.json
        - .project/reports/multipart-cad-reference/**/*
        - .gitlab-ci.yml
    - when: never

.portable-packages:
  cache:
    key:
      files:
        - X/Analysis/dependency-artifacts.json
    paths:
      - X/Analysis/artifacts/packages/
