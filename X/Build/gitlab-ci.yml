# Compile native dependencies only when their sources/consumers/build inputs change.
# Expensive CAD/desktop builds are explicit milestones while runner quota is scarce.
native-cad-linux-x64:
  extends: .portable-packages
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0-noble
  tags: [saas-linux-small-amd64]
  timeout: 45m
  rules:
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - X/Build/NativeCad/**/*
        - ThirdParty/Sources/NetgenMesher/**/*
        - X/Feasibility/Cad/verify-native.py
        - X/Feasibility/Cad/test_native.py
        - .project/reports/native-cad-meshing-reference/**/*
        - X/Build/gitlab-ci.yml
      when: manual
      allow_failure: true
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 g++ cmake make zlib1g-dev binutils patch
  script:
    - python3 ThirdParty/Sources/verify-sources.py
    - python3 -m unittest discover -s X/Feasibility/Cad -p test_native.py
    - dotnet build X/Feasibility/Cad/Inspect/Inspect.csproj -c Release --source /tmp --artifacts-path /tmp/native-cad-inspector
    - python3 X/Build/NativeCad/build.py --output X/Build/artifacts/native-cad-linux-x64 --jobs 2
    - python3 X/Feasibility/Cad/verify-native.py --mesher X/Build/artifacts/native-cad-linux-x64/runtime/bin/NetGenMesher --inspector /tmp/native-cad-inspector/bin/Inspect/release/PrePoMaxX.InspectVis.dll --output X/Build/artifacts/native-cad-linux-x64-check
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Build/artifacts/native-cad-linux-x64/build-receipt.json
      - X/Build/artifacts/native-cad-linux-x64/build.log
      - X/Build/artifacts/native-cad-linux-x64-check/

native-cpu-workflow-linux-x64:
  extends: .portable-packages
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0-noble
  tags: [saas-linux-small-amd64]
  # The desktop path can spend several minutes downloading pinned Qt/VTK wheels.
  timeout: 25m
  variables:
    GIT_DEPTH: "0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "web"'
      variables:
        BUILD_LINUX_DESKTOP: "1"
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - X/Build/**/*
        - X/Desktop/**/*
        - X/Feasibility/Cad/**/*
        - CaeModel/FileInOut/Input/VisFileReader/**/*
        - X/Feasibility/Pmx/**/*
        - X/Feasibility/PmxMesh/**/*
        - X/Feasibility/PmxDeck/**/*
      variables:
        BUILD_LINUX_DESKTOP: "1"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - ThirdParty/Build/**/*
        - ThirdParty/Sources/**/*
        - X/Build/**/*
        - X/Desktop/MeshScene/**/*
        - X/Execution/**/*
        - X/Analysis/**/*
        - X/Results/**/*
        - X/Core/**/*
        - X/Checks/gitlab-ci.yml
        - CaeGlobals/**/*.cs
        - CaeMesh/**/*.cs
        - CaeModel/**/*.cs
        - CaeResults/**/*.cs
        - CaeJob/**/*.cs
        - .gitlab-ci.yml
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 git tini gcc gfortran cmake make pkg-config libopenblas-dev binutils file
  script:
    - python3 -m unittest discover -s X/Build -p test_build.py
    - python3 X/Build/build.py build --target linux-x64 --output X/Build/artifacts/linux-x64-hosts
    - python3 X/Build/build.py build --target linux-x64 --component solver --jobs 2 --output X/Build/artifacts/linux-x64-native
    - tini -s -- python3 ThirdParty/Build/verify-workflow.py --build X/Build/artifacts/linux-x64-native/solver --hosts-dir X/Build/artifacts/linux-x64-hosts --output X/Build/artifacts/linux-x64-workflow
    - |
      if [ "${BUILD_LINUX_DESKTOP:-}" = 1 ]; then
        apt-get install -y --no-install-recommends python3-venv libpython3.12 patchelf xvfb xauth libgl1 libegl1 libgl1-mesa-dri libxrender1 libdbus-1-3 libfontconfig1 fonts-dejavu-core libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 libsm6 libglib2.0-0t64
        python3 -m venv /tmp/prepomaxx-desktop
        /tmp/prepomaxx-desktop/bin/python -m pip install --require-hashes --only-binary=:all: -r X/Desktop/requirements-linux-x64.txt
        /tmp/prepomaxx-desktop/bin/python X/Build/build.py package --target linux-x64 --format tar.gz --pmx-preview --solver-build X/Build/artifacts/linux-x64-native/solver --output X/Build/artifacts/linux-x64-desktop
        LIBGL_ALWAYS_SOFTWARE=1 tini -s -- xvfb-run -a -s "-screen 0 1400x1000x24" python3 X/Build/verify-linux-preview.py --package X/Build/artifacts/linux-x64-desktop --output X/Build/artifacts/linux-x64-desktop-check
        apt-get install -y --no-install-recommends desktop-file-utils
        python3 X/Build/linux_deb.py --package X/Build/artifacts/linux-x64-desktop --output X/Build/artifacts/linux-x64-deb
        tini -s -- python3 X/Build/verify-linux-deb.py --deb X/Build/artifacts/linux-x64-deb/*.deb --package X/Build/artifacts/linux-x64-desktop --output X/Build/artifacts/linux-x64-deb-check
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Build/artifacts/linux-x64-hosts/build.json
      - X/Build/artifacts/linux-x64-hosts/*.log
      - X/Build/artifacts/linux-x64-hosts/locks/
      - X/Build/artifacts/linux-x64-native/build.json
      - X/Build/artifacts/linux-x64-native/*.log
      - X/Build/artifacts/linux-x64-native/solver/*.json
      - X/Build/artifacts/linux-x64-native/solver/*.log
      - X/Build/artifacts/linux-x64-workflow/
      - X/Build/artifacts/linux-x64-desktop/build.json
      - X/Build/artifacts/linux-x64-desktop/*.log
      - X/Build/artifacts/linux-x64-desktop-check/*.json
      - X/Build/artifacts/linux-x64-desktop-check/*.stderr
      - X/Build/artifacts/linux-x64-desktop-check/desktop-workflow.png
      - X/Build/artifacts/linux-x64-deb/*.json
      - X/Build/artifacts/linux-x64-deb/*.log
      - X/Build/artifacts/linux-x64-deb-check/*.json
      - X/Build/artifacts/linux-x64-deb-check/*.log
