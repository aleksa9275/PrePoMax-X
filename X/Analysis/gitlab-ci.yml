analysis-workflow-linux-x64:
  extends: [.portable-current, .portable-packages]
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags: [saas-linux-small-amd64]
  timeout: 10m
  variables:
    GIT_DEPTH: "0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 git
  script:
    - python3 -m unittest discover -s X/Analysis -p test_analysis_layout.py
    - dotnet restore X/Analysis/PrePoMaxX.Analysis.slnx --configfile X/Analysis/NuGet.Config --packages X/Analysis/artifacts/packages
    - python3 X/Checks/check.py --profile fast --area analysis --output X/Checks/artifacts/analysis-linux-x64
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Checks/artifacts/analysis-linux-x64/
