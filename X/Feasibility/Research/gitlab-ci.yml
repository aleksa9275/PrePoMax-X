research-linux-x64:
  extends: .portable-current
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags: [saas-linux-small-amd64]
  timeout: 15m
  variables:
    GIT_DEPTH: "0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 git g++
  script:
    - python3 X/Feasibility/Research/run-research.py --expect-architecture X64 --output-dir X/Feasibility/Research/artifacts/linux-x64
    - python3 -m unittest discover -s X/Desktop -p test_cad_import.py
    - python3 -m unittest discover -s X/Desktop -p test_cad_scene.py
    - python3 -m unittest discover -s X/Feasibility/Cad -p test_native.py
    - dotnet build X/Feasibility/Cad/Inspect/Inspect.csproj -c Release --source /tmp --artifacts-path /tmp/prepomaxx-vis
    - python3 X/Feasibility/Cad/verify-vis.py --inspector /tmp/prepomaxx-vis/bin/Inspect/release/PrePoMaxX.InspectVis.dll --output X/Feasibility/Research/artifacts/linux-x64/vis.json
    - python3 X/Feasibility/Cad/verify-parts.py --inspector /tmp/prepomaxx-vis/bin/Inspect/release/PrePoMaxX.InspectVis.dll --output X/Feasibility/Research/artifacts/linux-x64/cad-parts.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Feasibility/Research/artifacts/linux-x64/*.json
