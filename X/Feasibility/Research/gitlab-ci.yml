research-linux-x64:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags: [saas-linux-small-amd64]
  timeout: 15m
  variables:
    GIT_DEPTH: "0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "research/native-feasibility" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 git g++
  script:
    - python3 X/Feasibility/Research/run-research.py --expect-architecture X64 --output-dir X/Feasibility/Research/artifacts/linux-x64
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Feasibility/Research/artifacts/linux-x64/*.json
