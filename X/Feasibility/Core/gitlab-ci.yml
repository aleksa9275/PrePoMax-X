core-feasibility-linux-x64:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - saas-linux-small-amd64
  variables:
    GIT_DEPTH: "0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - X/Feasibility/Core/**/*
        - STL/**/*
        - CaeGlobals/CommonClasses/Vec3D.cs
        - CaeMesh/Nodes/FeNode.cs
        - APIs/Python/Test_Scripts/Models/cube.stl
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - X/Feasibility/Core/**/*
        - STL/**/*
        - CaeGlobals/CommonClasses/Vec3D.cs
        - CaeMesh/Nodes/FeNode.cs
        - APIs/Python/Test_Scripts/Models/cube.stl
        - .gitlab-ci.yml
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 git
    # GitLab's feature-branch checkout may omit the divergent upstream release branch.
    - git fetch --no-tags https://gitlab.com/MatejB/PrePoMax.git refs/heads/v2.6.0
  script:
    - python3 X/Feasibility/Core/run-probe.py --expect-os Linux --expect-architecture X64 --output X/Feasibility/Core/artifacts/linux-x64-baseline.json
    - python3 X/Feasibility/Core/run-probe.py --revision 9e91252563739ee5304cea16c34863dfb17a74d5 --expect-os Linux --expect-architecture X64 --output X/Feasibility/Core/artifacts/linux-x64-v2.6.0.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Feasibility/Core/artifacts/*.json
