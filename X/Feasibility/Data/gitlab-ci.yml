core-data-linux-x64:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags: [saas-linux-small-amd64]
  timeout: 15m
  variables:
    GIT_DEPTH: "0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/core-data-feasibility" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 git
    - git fetch --no-tags https://gitlab.com/MatejB/PrePoMax.git refs/heads/v2.6.0
  script:
    - python3 X/Feasibility/Core/test_probe_evidence.py
    - python3 X/Feasibility/Core/run-ci.py
    - python3 X/Feasibility/Data/run-data.py --expect-os Linux --expect-architecture X64 --reference .project/reports/core-data/macos-arm64.json --output X/Feasibility/Data/artifacts/linux-x64.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Feasibility/Core/artifacts/ci/*.json
      - X/Feasibility/Data/artifacts/*.json
