shared-core-linux-x64:
  extends: .portable-current
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags: [saas-linux-small-amd64]
  timeout: 10m
  variables:
    GIT_DEPTH: "0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 git
  script:
    - python3 -m unittest discover -s X/Checks -p test_check.py
    - python3 -m unittest discover -s X/Core -p test_upstream_replay.py
    - python3 X/Checks/check.py --profile fast --area core --output X/Checks/artifacts/core-linux-x64
    - python3 X/Core/package.py
    - python3 X/Core/check-package.py --archive X/Core/artifacts/development-build/PrePoMaxX-Core-development.zip --report X/Core/artifacts/development-build/verification.json --expect-os Linux --expect-architecture X64
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - X/Checks/artifacts/core-linux-x64/
      - X/Core/artifacts/development-build/*.zip
      - X/Core/artifacts/development-build/*.json
